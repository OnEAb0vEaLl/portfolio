<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudarshan Giri — Software Developer</title>
<meta name="description" content="Sudarshan Giri — software engineering, cybersecurity and data engineering portfolio.">
<meta name="theme-color" content="#F7F3C8" id="tc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="software"]{
  --bg:#F7F3C8; --card:#FFFDF3; --ink:#191A3D; --soft:#54577D; --line:#E4DFAF;
  --a1:#F3E36A; --a2:#FF8B66; --a3:#B7E3C7; --on-a1:#191A3D; --link:#C2410C;
  --bd:2px solid #191A3D; --r:16px; --sh:6px 6px 0 var(--line); --sh-btn:6px 6px 0 #191A3D;
  --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --bgimg:none; --head:rgba(247,243,200,.9);
}
[data-theme="cyber"]{
  --bg:#0C1015; --card:#131A22; --ink:#E6EDF3; --soft:#9AA8B8; --line:#243140;
  --a1:#FF4D6D; --a2:#4FD1C5; --a3:#F5B83D; --on-a1:#0C1015; --link:#4FD1C5;
  --bd:1px solid #243140; --r:4px; --sh:none; --sh-btn:0 0 22px rgba(255,77,109,.45);
  --disp:'IBM Plex Mono',ui-monospace,monospace; --body:'IBM Plex Sans',system-ui,sans-serif;
  --bgimg:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px); --head:rgba(12,16,21,.92);
}
[data-theme="data"]{
  --bg:#EDF3F9; --card:#FFFFFF; --ink:#0B2540; --soft:#4A6380; --line:#CBD9E8;
  --a1:#1F6FEB; --a2:#0FA3A3; --a3:#FFB703; --on-a1:#FFFFFF; --link:#1F6FEB;
  --bd:1px solid #B7C9DC; --r:8px; --sh:0 2px 0 #CBD9E8; --sh-btn:0 3px 0 #0B2540;
  --disp:'Sora',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
  --bgimg:linear-gradient(#DCE7F2 1px,transparent 1px),linear-gradient(90deg,#DCE7F2 1px,transparent 1px); --head:rgba(237,243,249,.92);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.rv{opacity:1!important;transform:none!important}}
body{margin:0;background:var(--bg);background-image:var(--bgimg);background-size:40px 40px;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
h1,h2,h3,h4{font-family:var(--disp);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--a1);color:var(--on-a1);padding:8px 14px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
section{padding:72px 0;scroll-margin-top:84px}
.svg{width:18px;height:18px;fill:currentColor}
.ic,.si{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
header.top{position:sticky;top:0;z-index:50;background:var(--head);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--a2);transform-origin:left;transform:scaleX(0)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:700 1.1rem var(--disp);text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:6px;padding:5px;background:var(--card);border:var(--bd);border-radius:calc(var(--r) + 6px)}
.tabs a{position:relative;width:50px;height:42px;display:grid;place-items:center;color:var(--soft);border-radius:var(--r);transition:background .2s,color .2s,transform .2s}
.tabs a:hover{color:var(--ink);transform:translateY(-2px)}
.tabs .ic{width:23px;height:23px}
.tabs a[aria-current="page"]{background:var(--a1);color:var(--on-a1)}
.tabs a::after{content:attr(data-label);position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(-4px);background:var(--ink);color:var(--bg);font:600 .72rem var(--body);padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.tabs a:hover::after,.tabs a:focus-visible::after{opacity:1;transform:translateX(-50%)}
.links{display:flex;gap:4px}
.links a{font-size:.88rem;font-weight:600;color:var(--soft);text-decoration:none;padding:8px 12px;border-radius:calc(var(--r)/2);transition:.2s}
.links a:hover,.links a.on{color:var(--ink);background:var(--card)}
.social{display:flex;gap:4px}
.social a{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;transition:background .2s,color .2s}
.social a:hover{background:var(--a1);color:var(--on-a1)}
@media (max-width:1000px){.links{display:none}}
@media (max-width:640px){.brand{display:none}.bar{justify-content:space-between}.wrap{padding:0 20px}section{padding:56px 0}}

#view{animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

/* shared */
.hero{padding:60px 0 76px}
.hero-grid{display:grid;gap:48px;align-items:center}
.hello{color:var(--soft);font-size:1.12rem;margin:0 0 8px}
h1{line-height:1.06;letter-spacing:-.015em;margin-bottom:18px}
.sub{color:var(--soft);font-size:1.06rem;line-height:1.65;max-width:480px;margin:0 0 24px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.badge{font:700 .72rem var(--disp);padding:5px 10px;border:var(--bd);border-radius:calc(var(--r)/2);background:var(--card)}
.badge i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--a2)}
.cta{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--a1);color:var(--on-a1);font-weight:600;padding:13px 24px;border-radius:var(--r);border:2px solid var(--a1);text-decoration:none;box-shadow:var(--sh-btn);transition:transform .15s,box-shadow .15s}
[data-theme="software"] .btn{border-color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn svg{width:18px;height:18px}
.ghost{font-weight:600;text-decoration:none;border-bottom:2px solid var(--a2);padding:12px 2px;transition:.2s}
.ghost:hover{color:var(--link)}
.av{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:0 auto}
.av-c{position:relative;width:100%;height:100%;border-radius:50%;background:#191A3D;display:grid;place-items:center;overflow:hidden;border:var(--bd)}
.av-c b{font:700 4.4rem var(--disp);color:var(--a1)}
.av-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.head{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.hi{width:46px;height:46px;display:grid;place-items:center;background:var(--a1);color:var(--on-a1);border-radius:var(--r);flex-shrink:0}
.hi .si{width:24px;height:24px}
.head h2{font-size:clamp(1.7rem,3.2vw,2.4rem);letter-spacing:-.01em}
.card{background:var(--card);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.lead{font:700 clamp(1.25rem,2.4vw,1.6rem)/1.35 var(--disp);margin:0 0 16px}
.about p:not(.lead){line-height:1.75;color:var(--soft);margin:0 0 16px}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.facts div:last-child{border:0}
.facts span:first-child{color:var(--soft)}
.facts span:last-child{font-weight:600;text-align:right}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:980px){.grid3{grid-template-columns:1fr}}
h3{font-size:1.2rem;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.tag{font:600 .72rem var(--body);padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--soft)}
.tag.draft{border-style:dashed;color:var(--a3)}
.pts{list-style:none;margin:0 0 16px;padding:0}
.pts li{position:relative;padding-left:18px;margin-bottom:9px;font-size:.92rem;line-height:1.55;color:var(--soft)}
.pts li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--a2)}
.repo{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;text-decoration:none;color:var(--link)}
.repo::after{content:"→";transition:transform .2s}
.repo:hover::after{transform:translateX(4px)}
.edu{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.edu h3{margin-bottom:6px}.edu p{margin:0;color:var(--soft)}
.edu b{color:var(--link)}

/* software */
[data-theme="software"] .hero-grid{grid-template-columns:1.1fr .9fr}
[data-theme="software"] h1{font-size:clamp(2.5rem,5.6vw,4.2rem);font-weight:700}
[data-theme="software"] .av::before{content:"";position:absolute;inset:-16px;border:2px dashed var(--a2);border-radius:50%;opacity:.7;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-theme="software"] .av-c{border-color:var(--ink)}
.about{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:start}
[data-theme="software"] .proj{display:flex;flex-direction:column;border-top:6px solid var(--a1);transition:transform .2s,box-shadow .2s}
[data-theme="software"] .proj:hover{transform:translateY(-6px);box-shadow:10px 10px 0 var(--line)}
[data-theme="software"] .proj:nth-child(2){border-top-color:var(--a2)}
[data-theme="software"] .proj:nth-child(3){border-top-color:var(--a3)}
[data-theme="software"] .pts{flex-grow:1}
[data-theme="software"] .repo{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.skill h4{font-size:1.02rem;margin-bottom:16px}
.skill div{display:flex;flex-direction:column;gap:10px}
.skill span{display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:500}
.skill span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--a2);flex-shrink:0}
@media (max-width:860px){[data-theme="software"] .hero-grid{grid-template-columns:1fr;text-align:center}[data-theme="software"] .sub{margin-inline:auto}[data-theme="software"] .badges,[data-theme="software"] .cta{justify-content:center}[data-theme="software"] .av{order:-1;width:min(220px,60vw)}}

/* cyber */
[data-theme="cyber"] .hero-grid{grid-template-columns:1.6fr .4fr;align-items:start}
[data-theme="cyber"] .av{width:min(220px,60vw)}
[data-theme="cyber"] .av-c{border-radius:8px;background:#0A0D11;border-color:var(--a1);box-shadow:0 0 36px rgba(255,77,109,.25)}
.term{border:var(--bd);border-radius:8px;background:#0A0E13;overflow:hidden;box-shadow:0 24px 60px -28px rgba(255,77,109,.45)}
.tbar{display:flex;align-items:center;gap:7px;padding:11px 14px;background:#10161D;border-bottom:var(--bd);font:500 .78rem var(--disp);color:var(--soft)}
.tbar i{width:10px;height:10px;border-radius:50%;background:#2B3846}
.tbar i:first-child{background:var(--a1)}
.tbar span{margin-left:8px}
.tbody{padding:28px}
.tbody>p{margin:0 0 10px;font:500 .9rem var(--disp);color:var(--soft)}
.tbody>p b{color:var(--a2);margin-right:10px}
.tbody>p.sub{font:400 1.02rem/1.65 var(--body);padding-left:22px;margin-bottom:20px}
.tbody h1{font-size:clamp(1.9rem,4.2vw,3.1rem);font-weight:600;color:var(--ink);padding-left:22px}
.tbody h1::after{content:"";display:inline-block;width:.5em;height:.08em;margin-left:.2em;background:var(--a1);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tbody .badges,.tbody .cta{padding-left:22px}
[data-theme="cyber"] .badge{background:transparent;color:var(--a2);border-color:#1E3B3A}
.spec{display:grid;grid-template-columns:repeat(5,1fr);border:var(--bd);border-radius:4px;background:var(--card);margin-top:28px}
.spec div{padding:16px 18px;border-right:1px solid var(--line)}
.spec div:last-child{border:0}
.spec small{display:block;font:500 .72rem var(--disp);color:var(--a2);margin-bottom:6px}
.spec b{font-size:.9rem;font-weight:600;line-height:1.4}
@media (max-width:900px){[data-theme="cyber"] .hero-grid{grid-template-columns:1fr}.spec{grid-template-columns:1fr 1fr}.spec div{border-bottom:1px solid var(--line)}}
.row{display:grid;grid-template-columns:260px 1fr;gap:30px;padding:24px;margin-bottom:18px;border:var(--bd);border-left:3px solid var(--a1);border-radius:4px;background:var(--card);transition:border-color .2s,box-shadow .2s}
.row:hover{box-shadow:0 0 24px -8px rgba(79,209,197,.35);border-color:#34506b}
.row:nth-child(2){border-left-color:var(--a2)}.row:nth-child(3){border-left-color:var(--a3)}
@media (max-width:800px){.row{grid-template-columns:1fr;gap:6px}}
.mrow{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.mrow h4{font-size:.95rem;color:var(--a2)}
.mrow div{display:flex;flex-wrap:wrap;gap:8px}
.mrow span{font:500 .82rem var(--disp);padding:7px 12px;border:var(--bd);border-radius:3px;background:var(--card);transition:.2s}
.mrow span:hover{border-color:var(--a2);color:var(--a2)}
@media (max-width:700px){.mrow{grid-template-columns:1fr;gap:10px}}
[data-theme="cyber"] .edu{border-left:3px solid var(--a1)}

/* data */
[data-theme="data"] .hero-grid{grid-template-columns:1fr 380px}
[data-theme="data"] h1{font-size:clamp(2.3rem,5vw,3.7rem);font-weight:700}
@media (max-width:900px){[data-theme="data"] .hero-grid{grid-template-columns:1fr}}
[data-theme="data"] .av{width:112px;margin:0 0 22px}
[data-theme="data"] .av-c{background:#0B2540;border-color:var(--a1)}
[data-theme="data"] .av-c b{font-size:2.2rem;color:#fff}
.flow{position:relative}
.stage{position:relative;display:flex;gap:16px;padding:0 0 26px 0}
.stage:last-child{padding-bottom:0}
.stage::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:repeating-linear-gradient(var(--a1) 0 5px,transparent 5px 9px)}
.stage:last-child::before{display:none}
.stage .dot{width:32px;height:32px;border-radius:8px;background:var(--a1);color:#fff;display:grid;place-items:center;flex-shrink:0}
.stage:nth-child(3) .dot{background:var(--a2)}
.stage:nth-child(4) .dot{background:#0B2540}
.stage .dot .si{width:17px;height:17px}
.stage b{display:block;font:600 .98rem var(--disp)}
.stage small{color:var(--soft);font-size:.86rem}
[data-theme="data"] .about{grid-template-columns:.8fr 1.2fr}
[data-theme="data"] .about .lead{border-left:4px solid var(--a1);padding-left:18px}
[data-theme="data"] .facts div:nth-child(odd){background:#F6F9FC}
.lineage{position:relative;padding-left:46px}
.lineage::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--a1),var(--a2))}
.node{position:relative;margin-bottom:22px;border-left:4px solid var(--a1);transition:transform .2s}
.node:hover{transform:translateX(4px)}
.node::before{content:"";position:absolute;left:-46px;top:28px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--a1)}
.node:nth-child(2){border-left-color:var(--a2)}.node:nth-child(2)::before{border-color:var(--a2)}
.node:nth-child(3){border-left-color:var(--a3)}.node:nth-child(3)::before{border-color:var(--a3)}
.tbl{border:var(--bd);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--sh)}
.tbl h4{padding:13px 18px;background:#0B2540;color:#fff;font-size:.92rem}
.tbl span{display:block;padding:11px 18px;border-top:1px solid var(--line);font-size:.92rem}
.tbl span:nth-child(odd){background:#F6F9FC}

/* footer + top button */
footer{background:#14152F;color:#FFFDF3;padding:80px 0 36px;border-radius:36px 36px 0 0;margin-top:16px}
[data-theme="cyber"] footer{background:#06080B;border-top:1px solid var(--a1);border-radius:0}
[data-theme="data"] footer{background:#0B2540;border-radius:0}
footer h2{font-size:clamp(1.8rem,4vw,2.9rem);max-width:640px;line-height:1.12}
.crow{display:flex;justify-content:space-between;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-top:30px}
.mail{font:600 clamp(1.1rem,2.4vw,1.5rem) var(--disp);color:var(--a1);text-decoration:none;word-break:break-all}
[data-theme="data"] .mail{color:#7FB5FF}
.mail:hover{color:var(--a2)}
.fsoc{display:flex;gap:12px}
.fsoc a{width:44px;height:44px;border:2px solid #3B3D66;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s}
.fsoc a:hover{background:var(--a1);border-color:var(--a1);color:var(--on-a1)}
.fb{margin-top:60px;padding-top:24px;border-top:1px solid #33355C;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.85rem;color:#B0B2CE}
#up{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;border:var(--bd);background:var(--a1);color:var(--on-a1);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:40}
#up.show{opacity:1;transform:none;pointer-events:auto}
#up svg{width:20px;height:20px}
@media (max-width:800px){.about,[data-theme="data"] .about{grid-template-columns:1fr}.lineage{padding-left:30px}.node::before{left:-30px}.lineage::before{left:5px}}

/* tech icons */
.tic{display:inline-grid;place-items:center;flex-shrink:0;width:22px;height:22px;padding:3px;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.1);color:#1F2A44;vertical-align:middle}
.tic img,.tic svg{width:100%;height:100%;object-fit:contain;display:block}
.tic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tic svg.lg{fill:currentColor;stroke:none}
.tag .tic,.badge .tic{width:18px;height:18px;padding:2px;border-radius:5px}
.tag{display:inline-flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:7px}
.skill span::before{display:none}
.mrow span{display:inline-flex;align-items:center;gap:8px}
.tbl span{display:flex;align-items:center;gap:10px}

/* adaptability */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg{max-width:100%}
.card{--pad:26px;padding:var(--pad)}
[data-theme="data"] .facts div:nth-child(odd){margin:0 calc(var(--pad) * -1);padding:11px var(--pad)}
.facts div{flex-wrap:wrap}
.hero-grid>*,.about>*{min-width:0}
h1,.lead,.mail{overflow-wrap:anywhere}
header.top{padding-top:max(10px,env(safe-area-inset-top))}
.wrap{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
#up{right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom))}
@media (min-width:1500px){html{font-size:112.5%}.wrap{max-width:1320px}}
@media (min-width:2200px){html{font-size:125%}.wrap{max-width:1500px}}
@media (max-width:980px) and (min-width:621px){.grid3{grid-template-columns:repeat(2,1fr)}.grid3>:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:980px){.bar{gap:10px}}
@media (hover:none){.tabs a::after{display:none}.tabs a:hover,.btn:hover,[data-theme="software"] .proj:hover,.node:hover{transform:none}}
@media (max-width:640px){.wrap{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}.card{--pad:20px}.hero{padding:36px 0 52px}.head{margin-bottom:26px}footer{padding:56px 0 28px;border-radius:24px 24px 0 0}.fb{margin-top:40px}.tbody{padding:20px 16px}.tbody>p.sub,.tbody h1,.tbody .badges,.tbody .cta{padding-left:0}.btn{width:100%;justify-content:center}.cta{gap:12px}.social a:nth-child(3){display:none}.edu{flex-direction:column;align-items:flex-start;gap:8px}.mrow{padding:16px 0}.row{padding:18px}}

const ti = label => {
  const l = LOGO.find(x => x[0].test(label));
  if (l) {
    if (l[1] === "csharp") return `<span class="tic" aria-hidden="true"><svg class="lg" viewBox="0 0 24 24"><path d="M12 1.5 2.9 6.75v10.5L12 22.5l9.1-5.25V6.75z" fill="#68217A"/><text x="12" y="15.7" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Arial,sans-serif" fill="#fff">C#</text></svg></span>`;
    const b = BRAND[l[1]];
    return `<span class="tic" aria-hidden="true"><svg class="lg" viewBox="0 0 24 24" style="color:#${b[0]}"><path d="${b[1]}"/></svg></span>`;
  }
  const c = CONCEPT.find(x => x[0].test(label));
  return `<span class="tic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${GLYPH[c ? c[1] : "code"]}"/></svg></span>`;

/* helpers */
const ic = n => `<svg class="si" width="24" height="24"><use href="#i-${n}"/></svg>`;
const head = (i, t) => `<div class="head rv"><span class="hi">${ic(i)}</span><h2>${t}</h2></div>`;
const bd = a => a.map(s => `<span class="badge">${ti(s)}${s}</span>`).join("");
const tg = p => `<div class="tags">${p.tags.map(t => `<span class="tag${t === "EDIT ME" ? " draft" : ""}">${t === "EDIT ME" ? "" : ti(t)}${t}</span>`).join("")}</div>`;
const ul = p => `<ul class="pts">${p.pts.map(x => `<li>${x}</li>`).join("")}</ul>`;
const rp = p => p.url === "#" ? "" : `<a class="repo" href="${p.url}" target="_blank" rel="noopener">View repository<span class="sr" hidden> for ${p.t}</span></a>`;
const av = () => `<div class="av"><div class="av-c"><b>SG</b><img src="profile.jpeg" alt="Sudarshan Giri" loading="eager" onerror="this.style.display='none'"></div></div>`;
const facts = d => d.facts.map(f => `<div><span>${f[0]}</span><span>${f[1]}</span></div>`).join("");
const cta = `<div class="cta"><a class="btn" href="${RESUME}" target="_blank" rel="noopener"><svg class="si"><use href="#i-dl"/></svg>Download resume</a><a class="ghost" href="#work">View projects</a></div>`;

const projs = d => d.projects.filter(p => SHOW_DRAFTS || !p.tags.includes("EDIT ME"));

  data: d => `

/* reveal on scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 }) : null;

function show(k, setHash) {
  if (!P[k]) k = START;
  const d = P[k];
  document.body.dataset.theme = k;
  document.title = d.title;
  document.getElementById("tc").content = COLORS[k];
  document.getElementById("fh").textContent = d.foot;
  document.querySelectorAll(".tabs a").forEach(a => a.toggleAttribute("aria-current", a.dataset.k === k) || a.removeAttribute("aria-current"));
  document.querySelectorAll(".tabs a[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  const v = document.getElementById("view");
  v.innerHTML = R[k](d);
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
  v.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
  if (setHash) history.replaceState(null, "", "#" + k);
  window.scrollTo({ top: 0 });
  onScroll();
}

/* tabs are real links: use LINKS for separate pages, otherwise switch in place */
document.querySelectorAll(".tabs a").forEach(a => {
  const k = a.dataset.k;
  if (LINKS[k]) a.href = LINKS[k];
  a.addEventListener("click", e => { if (LINKS[k]) return; e.preventDefault(); show(k, true); });
  a.addEventListener("keydown", e => {
    const keys = Object.keys(P), i = keys.indexOf(k);
    const n = e.key === "ArrowRight" ? keys[(i + 1) % 3] : e.key === "ArrowLeft" ? keys[(i + 2) % 3] : null;
    if (n) { e.preventDefault(); show(n, true); document.querySelector(`.tabs a[data-k="${n}"]`).focus(); }
  });
});
document.querySelector(".brand").addEventListener("click", e => { e.preventDefault(); show("software", true); });

/* in-page anchors */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || a.closest(".tabs") || a.classList.contains("brand") || a.classList.contains("skip")) return;
  e.preventDefault();
  const t = a.getAttribute("href") !== "#" && document.querySelector(a.getAttribute("href"));
  t && t.scrollIntoView({ behavior: "smooth" });
});
document.getElementById("up").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

/* progress bar, back-to-top, active section link */
function onScroll() {
  const h = document.documentElement, max = h.scrollHeight - innerHeight;
  document.getElementById("prog").style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  document.getElementById("up").classList.toggle("show", scrollY > 600);
  let cur = "";
  ["about", "work", "skills", "edu"].forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; });
  document.querySelectorAll("#links a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (P[k]) show(k, false); });
show(location.hash.slice(1) || START, false);
</script>
